<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Msimu - seasonal advisory</title>
<meta name="description" content="Seasonal climate outlook and farming advisory for ASAL Kenya. ECMWF SEAS5 via Open-Meteo, ERA5 2005-2024 baseline." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --paper: #f3f1ea;
    --ink: #201a12;
    --ink-2: #5c564a;
    --line: #ded7c6;
    --card: #fffdf6;
    --sand: #ece7d9;
    --forest: #14342b;
    --forest-2: #23503f;
    --leaf: #2e7d4f;
    --leaf-dark: #256a42;
    --above: #2278a8;
    --near: #8b8f94;
    --below: #c4761c;
    --unknown: #b8b3a8;
    --alert: #a93226;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }
  :focus-visible { outline: 3px solid rgba(46, 125, 79, 0.5); outline-offset: 2px; }

  header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between;
    background: linear-gradient(150deg, var(--forest-2), var(--forest) 62%);
    color: #f0ede1; margin: -28px -20px 24px; padding: 26px 24px; border-radius: 0 0 20px 20px;
  }
  header :focus-visible { outline-color: rgba(240, 237, 225, 0.55); }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 34px; letter-spacing: -0.03em; margin: 0; font-weight: 900; color: #fff; }
  h1::after {
    content: ""; display: inline-block; width: 40px; height: 10px; margin-left: 12px; vertical-align: baseline;
    background:
      radial-gradient(circle at 5px 5px, var(--above) 4px, transparent 4.6px),
      radial-gradient(circle at 20px 5px, var(--near) 4px, transparent 4.6px),
      radial-gradient(circle at 35px 5px, var(--below) 4px, transparent 4.6px);
  }
  .tag { color: #a9bfae; font-size: 14px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button, input[type="number"] {
    font: inherit; padding: 8px 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 9px;
  }
  button { cursor: pointer; font-weight: 650; }
  button:hover, select:hover { border-color: var(--leaf); }
  button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: #fff; }
  #bfood, #plookup, #geolocate, #pkitchen, #pskill, #bphoto, #bsat, #bshare {
    background: var(--leaf); border-color: var(--leaf); color: #fff;
  }
  #bfood:hover, #plookup:hover, #geolocate:hover, #pkitchen:hover, #pskill:hover, #bphoto:hover, #bsat:hover, #bshare:hover {
    background: var(--leaf-dark); border-color: var(--leaf-dark);
  }
  input[type="checkbox"] { accent-color: var(--leaf); width: 15px; height: 15px; }
  label { font-size: 13px; color: var(--ink-2); font-weight: 550; }
  header label { color: #c5d0c2; }
  header select, header button { background: #1e4437; border-color: #3b5d4d; color: #efece0; }
  header button:hover, header select:hover { border-color: #7fbf9a; }
  header button[aria-pressed="true"] { background: #f0ede1; border-color: #f0ede1; color: var(--forest); }
  .switch { display: flex; border: 1px solid #3b5d4d; border-radius: 9px; overflow: hidden; }
  .switch button { border: 0; border-radius: 0; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; margin-top: 22px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h2 {
    font-size: 13.5px; color: var(--ink); margin: 0 0 14px; font-weight: 750; letter-spacing: 0.01em;
    display: flex; align-items: center; gap: 9px;
  }
  .card h2::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--leaf); flex: none; }

  .card.verdict {
    background: radial-gradient(130% 150% at 88% -25%, #2f6149 0%, var(--forest) 58%);
    border-color: #0e2a20; color: #f0ede1;
  }
  .verdict h2 { color: #a9bfae; }
  .verdict h2::before { background: #7fbf9a; }
  .verdict .note, .verdict .state { color: #c4d0c2; }
  .verdict .state.err { color: #f0a49a; }
  .verdict :focus-visible { outline-color: rgba(240, 237, 225, 0.55); }

  #map { height: 316px; border-radius: 10px; border: 1px solid var(--line); }
  .cardhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .cardhead h2 { margin: 0; }
  .you-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #2278a8; border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 120, 168, 0.55), 0 1px 4px rgba(0, 0, 0, 0.45); }
    70% { box-shadow: 0 0 0 15px rgba(34, 120, 168, 0), 0 1px 4px rgba(0, 0, 0, 0.45); }
    100% { box-shadow: 0 0 0 0 rgba(34, 120, 168, 0), 0 1px 4px rgba(0, 0, 0, 0.45); }
  }
  @media (prefers-reduced-motion: reduce) { .you-dot { animation: none; } }
  .leaflet-tooltip.ward-tip {
    background: var(--forest); color: #f0ede1; border: 0; border-radius: 6px;
    font-weight: 650; font-size: 12px; padding: 4px 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  .leaflet-tooltip.ward-tip::before { display: none; }
  .leaflet-container { font: inherit; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; border: 1px solid rgba(32, 26, 18, 0.18); }
  .attrib { font-size: 11px; color: var(--ink-2); margin: 6px 0 0; }

  .headline { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 750; color: #fff; background: var(--unknown); letter-spacing: 0.01em;
  }
  .chip.above { background: #3d92c9; }
  .chip.near { background: #6f747a; }
  .chip.below { background: var(--below); }
  .chip.unknown { background: #7d786d; }
  .month { font-size: 42px; font-weight: 900; letter-spacing: -0.025em; line-height: 1.05; }

  .strip { display: flex; gap: 7px; margin-top: 22px; height: 108px; }
  .strip .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; height: 100%; }
  .strip .track { position: relative; flex: 1; background: rgba(255, 255, 255, 0.07); border-radius: 7px; }
  .strip .barfill {
    position: absolute; left: 0; right: 0; bottom: 0; border-radius: 7px 7px 3px 3px;
    transform-origin: bottom; animation: grow 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
  .strip .med { position: absolute; left: -2px; right: -2px; height: 0; border-top: 2px dashed rgba(255, 255, 255, 0.55); }
  .strip b { font-size: 11px; font-weight: 650; color: #b9c8ba; text-align: center; letter-spacing: 0.02em; }
  @keyframes grow { from { transform: scaleY(0); } }
  @media (prefers-reduced-motion: reduce) { .strip .barfill { animation: none; } }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  /* Phones: the 7-month table keeps its columns and scrolls sideways inside its
     card instead of stretching the whole page (fixed 5 Nov after a 360px test). */
  #table { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #point-result, #food-result { overflow-x: auto; }
  #psearch-results button {
    display: block; width: 100%; text-align: left; margin: 4px 0; padding: 7px 9px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 8px;
    color: inherit; font: inherit; cursor: pointer;
  }
  #psearch-results button:hover { border-color: #2278a8; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 700; }
  tbody tr:hover { background: var(--sand); }
  .partial { color: var(--ink-2); font-style: italic; }
  .bar { position: relative; height: 10px; background: var(--sand); border-radius: 5px; overflow: hidden; min-width: 90px; }
  .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
  .bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.5; }

  ul.advice { margin: 0; padding-left: 18px; }
  ul.advice li { margin-bottom: 9px; }
  ul.advice li::marker { color: var(--leaf); }

  .foodform { background: var(--sand); border: 1px solid var(--line); border-radius: 11px; padding: 13px; }
  .note { font-size: 13px; color: var(--ink-2); }
  .warn { border-left: 3px solid var(--alert); padding-left: 10px; }
  footer { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; color: var(--ink-2); }
  footer code { background: var(--sand); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .state { padding: 34px 8px; text-align: center; color: var(--ink-2); }
  .state.err { color: var(--alert); }
  a { color: var(--leaf-dark); }
  .verdict a { color: #9fd4b2; }

  @media (max-width: 640px) {
    h1 { font-size: 27px; }
    header { padding: 20px 16px; margin-bottom: 20px; }
    .card { padding: 16px; }
    .month { font-size: 33px; }
    .strip { height: 86px; gap: 5px; }
    #map { height: 260px; }
    th, td { padding: 7px 4px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Msimu</h1>
      <span class="tag" id="tagline">Utabiri wa msimu &rarr; hatua ya kilimo</span>
    </div>
    <div class="controls">
      <label for="county" id="lbl-county">Kaunti</label>
      <select id="county" aria-label="County"></select>
      <label for="ward" id="lbl-ward">Kata</label>
      <select id="ward" aria-label="Ward"></select>
      <label><input type="checkbox" id="irr" /> <span id="lbl-irr">Umwagiliaji</span></label>
      <div class="switch" role="group" aria-label="Language">
        <button id="sw" aria-pressed="false">SW</button>
        <button id="en" aria-pressed="true">EN</button>
      </div>
    </div>
  </header>

  <section class="card" id="pointcard" style="margin-bottom:20px">
    <h2 id="lbl-point-h">Tafuta mahali husika</h2>
    <div class="controls">
      <button id="geolocate" type="button">Tumia GPS yangu</button>
      <label for="plat" id="lbl-plat">Latitudo</label>
      <input id="plat" type="number" step="0.0001" inputmode="decimal" placeholder="-1.28496" style="width:9em" />
      <label for="plon" id="lbl-plon">Longitudo</label>
      <input id="plon" type="number" step="0.0001" inputmode="decimal" placeholder="36.89468" style="width:9em" />
      <button id="plookup" type="button">Tafuta</button>
    </div>
    <div class="controls" style="margin-top:10px">
      <label for="psearch" id="lbl-psearch">Tafuta kwa jina</label>
      <input id="psearch" type="search" placeholder="jina la eneo, mf. Canopy Residence Gitanga" style="flex:1;min-width:13em" />
      <button id="psearchgo" type="button">Tafuta</button>
    </div>
    <div id="psearch-results" class="note" style="margin-top:6px"></div>
    <div class="controls" style="margin-top:10px">
      <label for="pnoon" id="lbl-pnoon">At midday, is the growing spot in sun or shade?</label>
      <select id="pnoon">
        <option value="sun">Sun</option>
        <option value="shade">Shade</option>
        <option value="unsure">Not sure</option>
      </select>
      <label for="pmorning" id="lbl-pmorning">In the morning, is it in sun or shade?</label>
      <select id="pmorning">
        <option value="sun">Sun</option>
        <option value="shade">Shade</option>
        <option value="unsure">Not sure</option>
      </select>
      <select id="paspect" hidden>
        <option value="unknown">Sijui</option>
        <option value="full_sun">Jua kila siku</option>
        <option value="morning_sun">Jua asubuhi</option>
        <option value="afternoon_shade">Kivuli jioni</option>
        <option value="shaded">Kivuli sana</option>
      </select>
      <label for="pwater" id="lbl-pwater">Chanzo cha maji</label>
      <select id="pwater">
        <option value="unknown">Sijui</option>
        <option value="tap">Mfereji/bomba</option>
        <option value="rainwater">Mvua</option>
        <option value="purchased">Maji ya kununua</option>
      </select>
      <label for="pter" id="lbl-pter">Hali ya mvua</label>
      <select id="pter">
        <option value="near">Kawaida</option>
        <option value="below">Chini ya kawaida</option>
        <option value="above">Juu ya kawaida</option>
      </select>
      <button id="pkitchen" type="button">Ushauri wa bustani ya jikoni</button>
      <button id="pskill" type="button">Usahihi wa matabiri</button>
    </div>
    <p class="note" id="point-status" style="margin-top:10px"></p>
    <div id="point-result" style="margin-top:10px"></div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="cardhead">
        <h2 id="h-map">Ramani ya kaunti</h2>
        <div class="switch">
          <button id="base-street" type="button" aria-pressed="true">Ramani</button>
          <button id="base-sat" type="button" aria-pressed="false">Satelaiti</button>
        </div>
      </div>
      <div id="map" role="img" aria-label="County ward map"></div>
      <p class="note" id="map-hint" style="margin-top:6px"></p>
      <div id="legend" class="legend" hidden></div>
      <p class="note" id="map-note" style="margin-top:10px"></p>
      <p class="attrib" id="ward-attrib" hidden></p>
    </section>

    <section class="card verdict">
      <h2 id="h-now">Kipindi kinachofuata</h2>
      <div id="now" class="state">Inapakia&hellip;</div>
      <div id="now-strip"></div>
    </section>
  </div>

  <section class="card" style="margin-top:20px">
    <h2 id="h-table">Miezi 7 ijayo (ECMWF SEAS5 vs wastani wa ERA5 2005-2024)</h2>
    <div id="table"><div class="state">Inapakia&hellip;</div></div>
    <p class="note" id="table-note" style="margin-top:10px"></p>
  </section>

  <section class="card" style="margin-top:20px">
    <h2 id="h-advice">Ushauri</h2>
    <div id="advice"><div class="state">Inapakia&hellip;</div></div>
  </section>

  <section class="card" style="margin-top:20px">
    <h2 id="h-food">Mpango wa usalama wa chakula</h2>
    <div class="controls foodform">
      <label for="fdwelling" id="lbl-fdwelling">Where you live</label>
      <select id="fdwelling">
        <option value="house">House with its own roof</option>
        <option value="flat">Flat / apartment (shared or no roof)</option>
      </select>
      <label for="froofL" id="lbl-froofL">Roof length (m)</label>
      <input id="froofL" type="number" min="0" max="100" step="0.5" value="6" inputmode="decimal" style="width:6em" />
      <label for="froofW" id="lbl-froofW">Roof width (m)</label>
      <input id="froofW" type="number" min="0" max="100" step="0.5" value="5" inputmode="decimal" style="width:6em" />
      <label for="fmat" id="lbl-fmat">Roof material</label>
      <select id="fmat">
        <option value="iron">Iron sheet</option>
        <option value="tiles">Tiles or concrete</option>
        <option value="thatch">Thatch</option>
      </select>
      <button id="bphoto" type="button">Check my roof photo</button>
      <button id="bsat" type="button">Check roof from satellite</button>
      <input id="fphoto" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      <label for="froof" id="lbl-froof">Eneo la paa (m2)</label>
      <input id="froof" type="number" min="0" max="1000" step="1" value="30" inputmode="numeric" style="width:7em" />
      <label for="fpeople" id="lbl-fpeople">Watu nyumbani</label>
      <input id="fpeople" type="number" min="1" max="30" step="1" value="4" inputmode="numeric" style="width:6em" />
      <button id="bfood" type="button">Tengeneza mpango</button>
      <button id="bshare" type="button" hidden>Share this plan</button>
    </div>
    <p class="note" id="surround-status" style="margin-top:8px"></p>
    <p class="note" id="food-status" style="margin-top:10px"></p>
    <div id="food-result" style="margin-top:10px"></div>
  </section>

  <footer>
    <p id="src"></p>
    <p id="caveat" class="warn"></p>
    <p id="howto"></p>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const T = {

    mapLegend: { above: 'juu ya kawaida', near: 'kawaida', below: 'chini ya kawaida', noData: 'hakuna taarifa bado' },
    noWard: 'hakuna taarifa bado',

    tercile: { above: 'juu ya kawaida', near: 'kawaida', below: 'chini ya kawaida', unknown: 'hakuna taarifa' },

    wardAttrib: 'Ward boundaries: geoBoundaries (CC BY 4.0)',
    now: 'Next usable month', table: 'Next 7 months: rain expected vs the 2005-2024 usual for this ward (ECMWF SEAS5 via Open-Meteo). The farming actions are rules, not guesses.',
    advice: 'Advisory', loading: 'Loading…',
    cols: ['Month', 'Rain expected', 'Usual rain (2005-2024)', 'Outlook', 'How sure', 'What to do - farming'],
    tercile: { above: 'above normal', near: 'near normal', below: 'below normal', unknown: 'unknown' },
    conf: { high: 'high', medium: 'medium', low: 'low', none: ' - ' },
    act: {
      above: 'Wetter than usual: plant early, drain waterlogged beds, fill every water container.',
      near: 'Normal rains: plant on your usual calendar; no special bet needed.',
      below: 'Drier than usual: short-maturing varieties, mulch, stagger planting, budget supplemental water.',
      unknown: 'No usable signal for this month yet: do not bet the season on it; check again closer to the month.',
      low: 'Weak signal: plan for normal conditions and re-check closer to the month.',
      partial: 'Partial month data: indicative only; the verdict comes when the month is complete.',
    },
    partial: 'partial',
    noData: 'No usable outlook for this period.',
    src: 'Source: ECMWF SEAS5 via Open-Meteo (no API key, no cost), against an ERA5 2005-2024 baseline.',
    caveat: 'SEAS5 data are not bias-corrected. This is an area forecast, not a single-farm forecast. Pilot service - consult your ward extension officer before planning.',
    howto: 'Extension-officer view: millimetres are shown here for analysis. Farmer-facing USSD screens show terciles only, never millimetres. API: <code>/county-outlook?county=kajiado</code> | <code>/advisory?ward=kajiado--nkaimurunya&amp;lang=en</code> | USSD: <code>POST /ussd</code>',
    err: 'Could not load data.',
  },
};
const TER_COLOR = { above: '#2278a8', near: '#8b8f94', below: '#c4761c', unknown: '#b8b3a8' };
const TER_TEXT = { above: '#1b5e8a', near: '#5f6469', below: '#96591a', unknown: '#8a857a' };
const MON = {
  sw: ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ago', 'Sep', 'Okt', 'Nov', 'Des'],
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
};
function fmtMonthKey(k) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(k ?? ''));
  return m ? `${(MON[lang] ?? MON.en)[Number(m[2]) - 1]} ${m[1]}` : String(k ?? '');
}

let lang = 'en';
let map, marker;
let baseLayer = null;
let baseKind = 'street';
let youMarker = null;
let youCircle = null;
let lastAccuracy = null;
let countyWardSlugs = new Map();

/**
 * Two basemaps, both free and keyless: OpenStreetMap streets and Esri World
 * Imagery satellite. The satellite view shows the land; the location itself
 * always comes from GPS or the labelled IP estimate, never from the imagery -
 * a browser cannot read a position out of picture tiles, and pretending
 * otherwise would be the kind of overstatement this service refuses to make.
 */
const BASES = {
  street: {
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attribution: '&copy; OpenStreetMap contributors',
  },
  sat: {
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics and the GIS User Community',
  },
};

function ensureMap() {
  if (map) return map;
  if (typeof L === 'undefined') return null; // CDN blocked: the map degrades, the page does not
  map = L.map('map', { scrollWheelZoom: false, preferCanvas: true }).setView([0.2, 37.9], 7);
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
  // Click-to-place: named search and GPS both fail sometimes (a residence that
  // is not in OSM by name, a denied permission). The map itself is always the
  // final authority - click where you stand and the whole dashboard follows.
  map.on('click', (e) => {
    if (!e?.latlng) return;
    $('plat').value = e.latlng.lat.toFixed(5);
    $('plon').value = e.latlng.lng.toFixed(5);
    lastAccuracy = null;
    doLookup();
  });
  setBase(baseKind);
  return map;
}

function setBase(kind) {
  baseKind = BASES[kind] ? kind : 'street';
  $('base-street').setAttribute('aria-pressed', String(baseKind === 'street'));
  $('base-sat').setAttribute('aria-pressed', String(baseKind === 'sat'));
  if (!map) return;
  if (baseLayer) map.removeLayer(baseLayer);
  const b = BASES[baseKind];
  baseLayer = L.tileLayer(b.url, { attribution: b.attribution, maxZoom: 19, maxNativeZoom: 19 }).addTo(map);
  // Choropleth reads differently on photography: repaint the wards for the base.
  if (wardLayer) wardLayer.setStyle(wardStyle);
}

/** The blue dot: where the phone or the IP estimate says you are, with the GPS accuracy ring when there is one. */
function setYouPin(lat, lon, accuracyM) {
  if (!ensureMap()) return;
  if (youMarker) { map.removeLayer(youMarker); youMarker = null; }
  if (youCircle) { map.removeLayer(youCircle); youCircle = null; }
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  const icon = L.divIcon({ className: '', html: '<div class="you-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  youMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000 }).addTo(map);
  youMarker.bindPopup((T[lang] ?? T.en).youHere);
  if (Number.isFinite(accuracyM) && accuracyM > 0 && accuracyM < 100000) {
    youCircle = L.circle([lat, lon], {
      radius: accuracyM, color: '#2278a8', weight: 1, fillColor: '#2278a8', fillOpacity: 0.12, interactive: false,
    }).addTo(map);
  }
}

const escAttr = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/**
 * After any successful point lookup: jump the choropleth to the county the
 * point sits in, select its ward so the whole dashboard follows, drop the
 * blue dot, and outline the matched ward. Never throws: the map is an
 * extension of the lookup, not a dependency of it.
 */
async function syncMapToPoint(p) {
  try {
    if (!p || p.latitude == null || p.longitude == null) return;
    const lat = Number(p.latitude);
    const lon = Number(p.longitude);
    const cs = p.county_slug;
    if (cs && $('county').value !== cs && [...$('county').options].some((o) => o.value === cs)) {
      $('county').value = cs;
      await loadCounty();
    }
    // Ward sync must run whether or not the county changed: a point inside the
    // already-selected county still has to move the dashboard to its ward.
    const slug = p.ward ? countyWardSlugs.get(p.ward) : null;
    if (slug && $('ward').value !== slug && [...$('ward').options].some((o) => o.value === slug)) {
      $('ward').value = slug;
      load();
    }
    setYouPin(lat, lon, lastAccuracy);
    if (map) map.setView([lat, lon], Math.min(Math.max(map.getZoom(), 11), 15));
    if (wardLayer && p.ward_id) {
      wardLayer.eachLayer((l) => {
        if (l.feature?.properties?.id === p.ward_id) l.setStyle({ color: baseKind === 'sat' ? '#ffffff' : '#16181a', weight: 3 });
      });
    }
  } catch { /* the lookup result stands on its own */ }
}

const $ = (id) => document.getElementById(id);
$('base-street').addEventListener('click', () => setBase('street'));
$('base-sat').addEventListener('click', () => setBase('sat'));

function applyStrings(t) {
  document.documentElement.lang = lang;
  $('tagline').textContent = t.tagline;
  $('lbl-county').textContent = t.county;
  $('lbl-ward').textContent = t.ward;
  $('lbl-irr').textContent = t.irrigation;
  $('h-map').textContent = t.map;
  $('base-street').textContent = t.base.street;
  $('base-sat').textContent = t.base.sat;
  $('h-now').textContent = t.now;
  $('h-table').textContent = t.table;
  $('h-advice').textContent = t.advice;
  $('src').textContent = t.src;
  $('caveat').textContent = t.caveat;
  $('howto').innerHTML = t.howto;
}

function chip(tercile, t) {
  return `<span class="chip ${tercile}">${t.tercile[tercile] ?? tercile}</span>`;
}

function renderNow(d, t, site) {
  const now = $('now');
  if (!d.month || d.tercile === 'unknown') {
    now.innerHTML = `<div class="state">${t.noData}</div>`;
    return;
  }
  now.innerHTML = `
    <div class="headline">
      <span class="month">${fmtMonthKey(d.month)}</span>
      ${chip(d.tercile, t)}
      <span class="note">${t.conf[d.confidence] ?? d.confidence}</span>
    </div>
    <p class="note" style="margin:10px 0 0">
      ${d.forecast_mm} mm · median ${d.median_mm} mm ·
      ${Math.round(((d.forecast_mm - d.median_mm) / d.median_mm) * 100)}%
    </p>`;
}

/**
 * The "what to do" column: deterministic rules over tercile + confidence, the
 * same transparency as everything else in Msimu. It turns each month's numbers
 * into the farming decision it implies - that is the whole point of the table:
 * de-risking the season, not displaying meteorology.
 */
function actionFor(m, t) {
  if (!m.complete) return t.act.partial;
  if (!m.tercile || m.tercile === 'unknown') return t.act.unknown;
  if (!m.confidence || m.confidence === 'low' || m.confidence === 'none') return t.act.low;
  return t.act[m.tercile] ?? t.act.unknown;
}

function renderTable(months, t) {
  const host = $('table');
  if (!months?.length) { host.innerHTML = `<div class="state">${t.noData}</div>`; return; }
  const max = Math.max(...months.map((m) => Math.max(m.forecast_mm ?? 0, m.median_mm ?? 0)), 1);
  const rows = months.map((m) => {
    const w = Math.round(((m.forecast_mm ?? 0) / max) * 100);
    const mw = Math.round(((m.median_mm ?? 0) / max) * 100);
    const vsPct = m.median_mm ? Math.round(((m.forecast_mm - m.median_mm) / m.median_mm) * 100) : null;
    const vsTxt = vsPct === null ? '' : ` <span style="color:${vsPct >= 0 ? '#2e7d32' : '#b23c17'};font-weight:650">${vsPct >= 0 ? '+' : ''}${vsPct}%</span>`;
    return `<tr>
      <td style="text-align:left">${fmtMonthKey(m.month)}${m.complete ? '' : ` <span class="partial">(${t.partial} ${m.days_covered ?? '?'}/${m.days_expected ?? '?'})</span>`}</td>
      <td>${m.forecast_mm ?? ' - '} mm</td>
      <td>${m.median_mm ?? ' - '} mm${vsTxt}</td>
      <td style="text-align:left"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-start">
        <div class="bar" style="min-width:64px;flex:0 0 auto"><span style="width:${w}%;background:${TER_COLOR[m.tercile]}"></span><i style="left:${mw}%"></i></div>
        <span style="color:${TER_TEXT[m.tercile] ?? TER_TEXT.unknown};font-weight:650;white-space:nowrap">${t.tercile[m.tercile] ?? m.tercile}</span>
      </div></td>
      <td style="text-align:left">${t.conf[m.confidence] ?? m.confidence}</td>
      <td style="text-align:left;font-size:12.5px;line-height:1.45">${actionFor(m, t)}</td>
    </tr>`;
  }).join('');
  host.innerHTML = `<table><caption class="note" style="caption-side:top;text-align:left;padding-bottom:6px">${t.table}</caption>
    <thead><tr>${t.cols.map((c, i) => `<th${i === 0 || i >= 3 ? ' style="text-align:left"' : ''}>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}

/**
 * The season strip: the whole 7-month outlook in one glance. Bar height is the
 * forecast in mm, colour is the tercile, the dashed tick is the 20-year median,
 * and partial months render dimmed because they are never classified.
 */
function renderStrip(months, t) {
  const host = $('now-strip');
  if (!host) return;
  if (!months?.length) { host.innerHTML = ''; return; }
  const max = Math.max(...months.map((m) => Math.max(m.forecast_mm ?? 0, m.median_mm ?? 0)), 1);
  const label = months
    .map((m) => `${fmtMonthKey(m.month)}: ${m.forecast_mm ?? 0} mm, ${t.tercile[m.tercile] ?? m.tercile}`)
    .join('; ');
  host.innerHTML = `<div class="strip" role="img" aria-label="${label.replace(/"/g, '&quot;')}">` +
    months.map((m, i) => {
      const h = Math.round(((m.forecast_mm ?? 0) / max) * 100);
      const mh = Math.round(((m.median_mm ?? 0) / max) * 100);
      const c = TER_COLOR[m.tercile] ?? TER_COLOR.unknown;
      const dim = m.complete ? '' : 'opacity:0.45;';
      return `<div class="col"><div class="track">
        <span class="barfill" style="height:${h}%;background:${c};${dim}animation-delay:${i * 60}ms"></span>
        <i class="med" style="bottom:${mh}%"></i>
      </div><b>${fmtMonthKey(m.month).slice(0, 3)}</b></div>`;
    }).join('') + '</div>';
}

function renderAdvice(d, t) {
  const host = $('advice');
  const lines = d.advisory ?? [];
  if (!lines.length) { host.innerHTML = `<div class="state">${t.noData}</div>`; return; }
  host.innerHTML = `<ul class="advice">${lines.map((l) => `<li>${String(l).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))}</li>`).join('')}</ul>`;
}

const BOUNDARIES = 'boundaries/';
let countyWards = [];
let tercileById = new Map();
let wardLayer = null;

/** 47 counties, one option each. Kajiado stays the default because it is the pilot. */
async function loadCounties() {
  try {
    const d = await (await fetch('/counties')).json();
    const sel = $('county');
    sel.innerHTML = (d.counties ?? []).map((c) => `<option value="${c.slug}">${c.name} (${c.ward_count})</option>`).join('');
    if ([...sel.options].some((o) => o.value === 'kajiado')) sel.value = 'kajiado';
  } catch { /* the ward select stays empty and load() shows the error state */ }
}

/**
 * County choropleth: one /county-outlook call gives every ward in the county a tercile, so the map
 * is coloured from a single seasonal request rather than one request per ward. Wards whose own ERA5
 * cell has not been built yet borrow the nearest cell and say so in the popup and table note.
 */
async function loadCounty() {
  const t = T[lang];
  const slug = $('county').value;
  if (!slug) return;
  $('map-note').textContent = t.loading;
  try {
    const [outlook, wards] = await Promise.all([
      (await fetch(`/county-outlook?county=${encodeURIComponent(slug)}`)).json(),
      (await fetch(`/wards?county=${encodeURIComponent(slug)}`)).json(),
    ]);
    countyWards = outlook.wards ?? [];
    tercileById = new Map(countyWards.map((w) => [w.id, w]));
    countyWardSlugs = new Map((wards.wards ?? []).map((w) => [w.name, w.slug]));
    const sel = $('ward');
    const prev = sel.value;
    sel.innerHTML = (wards.wards ?? [])
      .map((w) => `<option value="${w.slug}">${w.name} - ${w.sub_county}</option>`)
      .join('');
    if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
    await drawCounty(slug, t, wards.county ?? slug);
  } catch (err) {
    $('map-note').textContent = `${t.err} ${String(err.message)}`;
  }
}

async function drawCounty(slug, t, countyName) {
  let fc = null;
  try {
    const res = await fetch(`${BOUNDARIES}${slug}-wards.geojson`);
    if (res.ok) fc = await res.json();
  } catch {
    fc = null;
  }

  if (!fc) {
    $('legend').hidden = true;
    $('ward-attrib').hidden = true;
    $('map-note').textContent = t.mapMissing;
    return;
  }

  if (!ensureMap()) {
    $('legend').hidden = true;
    $('ward-attrib').hidden = true;
    $('map-note').textContent = t.mapMissing;
    return;
  }
  if (wardLayer) {
    map.removeLayer(wardLayer);
    wardLayer = null;
  }

  wardLayer = L.geoJSON(fc, {
    style: (feature) => wardStyle(feature),
    onEachFeature: (feature, layer) => {
      const w = tercileById.get(feature?.properties?.id);
      layer.bindPopup(popupFor(feature?.properties, w, t));
      layer.bindTooltip(escAttr(feature?.properties?.ward), { className: 'ward-tip', sticky: true });
      layer.on('mouseover', () => {
        layer.setStyle({ weight: baseKind === 'sat' ? 3 : 2.4, fillOpacity: baseKind === 'sat' ? 0.7 : 0.84 });
      });
      layer.on('mouseout', () => wardLayer.resetStyle(layer));
      layer.on('click', (e) => {
        // Keep the click on the ward: without this the map's click-to-place
        // handler also fires and runs a second lookup for the same tap.
        if (e?.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
        if (!w) return;
        $('ward').value = w.slug;
        load();
      });
    },
  }).addTo(map);
  map.fitBounds(wardLayer.getBounds(), { padding: [10, 10] });

  renderLegend(t, true);
  $('map-note').textContent = t.mapNoteCounty(countyName, countyWards.length);
  $('ward-attrib').textContent = `${t.wardAttrib} ${fc.properties?.attribution ?? ''}`.trim();
  $('ward-attrib').hidden = false;
}

function wardStyle(feature) {
  const w = tercileById.get(feature?.properties?.id);
  const selected = Boolean(w) && w.slug === $('ward').value;
  const sat = baseKind === 'sat';
  return {
    // On photography, dark outlines vanish; paper-white edges keep the wards legible.
    color: selected ? (sat ? '#ffffff' : '#16181a') : sat ? 'rgba(255, 253, 246, 0.75)' : '#8d8880',
    weight: selected ? 3 : sat ? 1.3 : 1,
    fillColor: TER_COLOR[w?.tercile ?? 'unknown'] ?? TER_COLOR.unknown,
    fillOpacity: w ? (sat ? 0.58 : 0.72) : 0.25,
  };
}

function popupFor(props, w, t) {
  const name = escAttr(props?.ward ?? '');
  if (!w) return `${name}<br><strong>${t.noWard}</strong>`;
  const extra = w.cell_source === 'nearest' ? `<br>${t.nearestCell(w.cell_distance_km)}` : '';
  return `${name}<br><strong>${t.tercile[w.tercile] ?? w.tercile}</strong><br>${t.conf[w.confidence] ?? w.confidence}${extra}`;
}

function renderLegend(t, hasWards) {
  const legend = $('legend');
  if (!hasWards) {
    legend.hidden = true;
    return;
  }
  legend.hidden = false;
  legend.innerHTML =
    ['above', 'near', 'below']
      .map((k) => `<span><i style="background:${TER_COLOR[k]}"></i>${t.mapLegend[k]}</span>`)
      .join('') + `<span><i style="background:#d9d5cc"></i>${t.mapLegend.noData}</span>`;
}

function placeMarker(site, t) {
  if (!map || site.latitude == null || site.longitude == null) return;
  const latlng = [site.latitude, site.longitude];
  if (!marker) {
    marker = L.marker(latlng).addTo(map).bindPopup(site.name);
  } else {
    marker.setLatLng(latlng);
    marker.setPopupContent(site.name);
  }
  $('map-note').textContent = t.mapNote(site, site.elevation_m ?? '?', site.annual?.water_balance_pct ?? '?');
}

async function load() {
  const t = T[lang];
  applyStrings(t);
  $('now').innerHTML = `<div class="state">${t.loading}</div>`;
  $('now-strip').innerHTML = '';
  $('advice').innerHTML = `<div class="state">${t.loading}</div>`;
  $('table').innerHTML = `<div class="state">${t.loading}</div>`;

  const ward = $('ward').value;
  if (!ward) {
    $('now').innerHTML = `<div class="state">${t.noWard}</div>`;
    $('advice').innerHTML = '';
    $('table').innerHTML = '';
    return;
  }

  const q = new URLSearchParams({ ward, lang, irrigation: $('irr').checked });
  try {
    const res = await fetch(`/advisory?${q}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    const f = await (await fetch(`/forecast?${q}`)).json();
    const siteData = f.site && typeof f.site === 'object' ? f.site : null;
    renderNow(d, t);
    renderStrip(d.outlook, t);
    renderTable(d.outlook, t);
    renderAdvice(d, t);
    if (siteData) placeMarker(siteData, t);
    if (wardLayer) wardLayer.setStyle(wardStyle);
    $('table-note').textContent =
      siteData?.cell?.source === 'nearest' ? t.nearestCell(siteData.cell.distance_km) : '';
  } catch (err) {
    const msg = `${t.err} <code>${String(err.message)}</code>`;
    $('now').innerHTML = `<div class="state err">${msg}</div>`;
    $('now-strip').innerHTML = '';
    $('advice').innerHTML = '';
    $('table').innerHTML = '';
  }
}

async function refresh() {
  await loadCounty();
  await load();
}

for (const id of ['sw', 'en']) {
  $(id).addEventListener('click', () => {
    lang = id;
    $('sw').setAttribute('aria-pressed', String(lang === 'sw'));
    $('en').setAttribute('aria-pressed', String(lang === 'en'));
    refresh();
  });
}
$('county').addEventListener('change', () => {
  foodTarget = 'ward';
  refresh().then(() => { if (lastFood) doFood(); });
});
$('ward').addEventListener('change', () => {
  foodTarget = 'ward';
  load();
  if (lastFood) doFood();
});
$('irr').addEventListener('change', load);

loadCounties().then(refresh);
</script>

<script>
/*
 * Precise point lookup and kitchen garden advisory.
 *
 * Kept in its own block so the ward dashboard above stays untouched. It reads the
 * shared `lang` binding rather than duplicating language state, and re-renders
 * when either language button is pressed.
 *
 * Container depths and harvest windows come from the API with
 * data_status: "unverified_draft". That label is rendered every time on purpose:
 * these are standard horticultural ranges, not Kenyan trial data.
 */
const PT = {
  sw: {
    h: 'Tafuta mahali husika',
    geo: 'Tumia GPS yangu',
    lookup: 'Tafuta',
    kitchenBtn: 'Ushauri wa bustani ya jikoni',
    skillBtn: 'Usahihi wa matabiri',
    lat: 'Latitudo', lon: 'Longitudo',
    aspect: 'Jua mahali pako', water: 'Chanzo cha maji', tercile: 'Hali ya mvua',
    sunNoon: 'Adhuhuri, mahali pa kupanda kuna jua au kivuli?', sunMorning: 'Asubuhi, kuna jua au kivuli?',
    sunOpts: { sun: 'Jua', shade: 'Kivuli', unsure: 'Sijui' },
    aspects: { unknown: 'Sijui', full_sun: 'Jua kila siku', morning_sun: 'Jua asubuhi', afternoon_shade: 'Kivuli jioni', shaded: 'Kivuli sana' },
    waters: { unknown: 'Sijui', tap: 'Mfereji/bomba', rainwater: 'Mvua', purchased: 'Maji ya kununua' },
    terciles: { near: 'Kawaida', below: 'Chini ya kawaida', above: 'Juu ya kawaida' },
    geoUnsupported: 'Kifaa hakiwezi kutoa GPS. Andika latitudo na longitudo wewe mwenyewe.',
    geoDenied: 'Ruhusa ya GPS imekataliwa. Andika latitudo na longitudo wewe mwenyewe.',
    geoWorking: 'Inatafuta GPS…',
    needCoords: 'Tafadhali weka latitudo na longitudo.',
    loading: 'Inapakia…',

function ptLabels() {
  const t = pt();
  $('lbl-point-h').textContent = t.h;
  $('geolocate').textContent = t.geo;
  $('plookup').textContent = t.lookup;
  $('pkitchen').textContent = t.kitchenBtn;
  $('pskill').textContent = t.skillBtn;
  $('lbl-plat').textContent = t.lat;
  $('lbl-plon').textContent = t.lon;
  $('lbl-psearch').textContent = t.searchLbl;
  $('psearchgo').textContent = t.searchBtn;
  $('psearch').placeholder = t.searchPh;
  $('map-hint').textContent = t.mapHint;
  $('lbl-pwater').textContent = t.water;
  $('lbl-pter').textContent = t.tercile;
  for (const [sel, dict] of [['paspect', t.aspects], ['pwater', t.waters], ['pter', t.terciles]]) {
    for (const opt of $(sel).options) if (dict[opt.value]) opt.textContent = dict[opt.value];
  }
  $('lbl-pnoon').textContent = t.sunNoon;
  $('lbl-pmorning').textContent = t.sunMorning;
  for (const sel of ['pnoon', 'pmorning']) {
    for (const opt of $(sel).options) if (t.sunOpts[opt.value]) opt.textContent = t.sunOpts[opt.value];
  }
  if (lastPoint) renderPoint(lastPoint);
  if (lastKitchen) renderKitchen(lastKitchen);
  if (lastSkill) renderSkill(lastSkill);
  $('h-food').textContent = t.foodH;
  $('lbl-fdwelling').textContent = t.foodDwelling;
  for (const opt of $('fdwelling').options) if (t.dwellings[opt.value]) opt.textContent = t.dwellings[opt.value];
  $('lbl-froofL').textContent = t.roofLen;
  $('lbl-froofW').textContent = t.roofWid;
  $('lbl-fmat').textContent = t.material;
  for (const opt of $('fmat').options) if (t.materials[opt.value]) opt.textContent = t.materials[opt.value];
  $('bphoto').textContent = t.photoBtn;
  $('bsat').textContent = t.satBtn;
  $('lbl-froof').textContent = t.foodRoof;
  $('lbl-fpeople').textContent = t.foodPeople;
  $('bfood').textContent = t.foodBtn;
  $('bshare').textContent = t.share;
  if (lastFood) renderFood(lastFood);
}

// Which target the food card follows: the ward pickers, or the point card once
// the user has run a lookup or GPS fix. Prevents stale coordinates in the
// lat/lon fields from silently hijacking a ward plan.
let foodTarget = 'ward';

function renderPoint(d) {
  const t = pt();
  const l = d.exact === undefined ? d : d;
  $('point-status').textContent =
    t.found(l) + t.elevation(d.elevation_m) + t.et0(d.et0_today_mm);
  $('point-result').innerHTML = '';
}

function renderKitchen(d) {
  const t = pt();
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rows = d.recommended.map((r) => `
    <li><strong>${esc(r.name)}</strong> &middot; ${t.depth} ${r.min_depth_cm} cm &middot; ${r.min_volume_litres} ${t.lires}
      &middot; ${r.days_to_first_harvest.join('-')} ${t.days} &middot; ${t.spacing} ${r.spacing_cm} cm
      ${r.support_needed ? ' &middot; <em>staking</em>' : ''}
      <br /><span class="note">${esc(r.notes)}</span></li>`).join('');
  const unsuit = d.unsuitable.map((u) => esc(u.name)).join(', ');
  const warns = d.warnings.map((w) => `<li>${esc(w.detail)}</li>`).join('') || `<li>${esc('-')}</li>`;
  $('point-result').innerHTML = `
    <h3>${esc(t.kitchenH)}</h3>
    <p><strong>${esc(t.watering)}:</strong> ${esc(d.watering.detail)}</p>
    <p><strong>${esc(t.crops)}:</strong></p>
    <ul>${rows || '<li>-</li>'}</ul>
    <p><strong>${esc(t.unsuitable)}:</strong> ${unsuit || '-'}</p>
    <p><strong>${esc(t.warnings)}:</strong></p>
    <ul>${warns}</ul>
    <p class="warn">${esc(d.data_status === 'unverified_draft' ? t.draftNote : d.caveat)}</p>`;
}

function renderSkill(d) {
  const t = pt();
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (!d.models || !d.models.length) {
    $('point-result').innerHTML = `<h3>${esc(t.skillH)}</h3><p class="note">${esc(t.skillNoData)}</p>`;
    return;
  }
  const rows = d.models.map((mo, i) => `
    <tr${i === 0 ? ' style="font-weight:600"' : ''}>
      <td>${esc(mo.label)}</td>
      <td>${mo.mean_mae_short_range_mm ?? '-'}</td>
      <td>${mo.mean_mae_all_leads_mm ?? '-'}</td>
      <td>${mo.mean_bias_all_leads_mm ?? '-'}</td>

  $('point-result').innerHTML = `
    <h3>${esc(t.skillH)}</h3>

async function doLookup(accuracyM) {
  const t = pt();
  lastAccuracy = Number.isFinite(accuracyM) ? accuracyM : null;
  const lat = $('plat').value.trim();
  const lon = $('plon').value.trim();
  if (!lat || !lon) {
    $('point-status').textContent = t.needCoords;
    return;
  }
  $('point-status').textContent = t.loading;
  $('point-result').innerHTML = '';
  lastKitchen = null;
  try {
    const res = await fetch(`/locate?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastPoint = await res.json();
    renderPoint(lastPoint);
    foodTarget = 'point';
    if (lastFood) doFood();
    suggestSurroundings(lastPoint.latitude, lastPoint.longitude);
    syncMapToPoint(lastPoint);
  } catch (err) {
    $('point-status').textContent = `${t.err} ${String(err.message)}`;
  }
}

/**
 * Ask the map what is built around the point and pre-fill the food form with
 * it: apartment-heavy blocks suggest "flat", the most common mapped roof
 * material suggests the roof. Every suggestion stays a map-derived hint the
 * status line tells the user to confirm, and a point with nothing mapped gets
 * an honest "nothing is mapped here" instead of a guess.
 */
async function suggestSurroundings(lat, lon) {
  const t = pt();
  const el = $('surround-status');
  if (!el || lat == null || lon == null) return;
  el.textContent = t.surroundWorking;
  try {
    const res = await fetch(`/surroundings?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    const s = j.suggestion;
    if (!s || (!s.dwelling && !s.roof_material)) {
      el.textContent = t.surroundNone;
      return;
    }
    let dwellingLabel = '';
    let materialLabel = '';
    if (s.dwelling && $('fdwelling').value !== s.dwelling) {
      $('fdwelling').value = s.dwelling;
      $('fdwelling').dispatchEvent(new Event('change'));
    }
    if (s.dwelling) dwellingLabel = t.dwellings[s.dwelling] ?? s.dwelling;
    if (s.roof_material && $('fmat').value !== s.roof_material) {
      $('fmat').value = s.roof_material;
      $('fmat').dispatchEvent(new Event('change'));
    }
    if (s.roof_material) materialLabel = t.materials[s.roof_material] ?? s.roof_material;
    el.textContent = t.surroundSuggested(dwellingLabel, materialLabel);
  } catch {
    // map services are a courtesy, not a dependency: stay quiet on failure
    el.textContent = '';
  }
}

async function doKitchen() {
  const t = pt();
  const lat = $('plat').value.trim();
  const lon = $('plon').value.trim();
  if (!lat || !lon) {
    $('point-status').textContent = t.needCoords;
    return;
  }
  $('point-status').textContent = t.loading;
  try {
    const q = new URLSearchParams({
      lat, lon,
      aspect: $('paspect').value,
      water: $('pwater').value,
      tercile: $('pter').value,
      lang,
    });
    const res = await fetch(`/kitchen?${q}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastKitchen = await res.json();
    lastSkill = null;
    lastPoint = lastKitchen.location ?? lastPoint;
    renderKitchen(lastKitchen);
  } catch (err) {
    $('point-status').textContent = `${t.err} ${String(err.message)}`;
  }
}

async function doSkill() {
  const t = pt();
  const lat = $('plat').value.trim();
  const lon = $('plon').value.trim();
  if (!lat || !lon) {
    $('point-status').textContent = t.needCoords;
    return;
  }
  $('point-status').textContent = t.loading;
  try {
    const q = new URLSearchParams({ lat, lon, days: '7', lang });
    const res = await fetch(`/skill?${q}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastSkill = await res.json();
    lastKitchen = null;
    renderSkill(lastSkill);
  } catch (err) {
    $('point-status').textContent = `${t.err} ${String(err.message)}`;
  }
}

function renderFood(d) {
  const t = pt();
  if (!foodPeopleDirty && Number.isFinite(d?.inputs?.people)) $('fpeople').value = d.inputs.people;
  $('bshare').hidden = false;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const name = (p) => (lang === 'en' || !p.sw || p.sw === p.en ? p.en : `${p.sw} (${p.en})`);
  const lines = (d.lines ?? []).map((l) => `<li>${esc(l)}</li>`).join('');
  const fmtMonth = fmtMonthKey;
  const cropRows = (d.planting?.plant ?? [])
    .map((p) => `<tr><td>${esc(name(p))}</td><td>${esc(fmtMonth(p.plant_by))}</td><td>${esc(fmtMonth(p.harvest))}</td></tr>`)
    .join('');
  const srcs = (d.sources ?? [])
    .map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`)
    .join('');
  const verify = (d.verify_with ?? [])
    .map(
      (v) =>
        `<li><strong>${esc(v.title?.[lang] ?? v.title?.en)}</strong>: ${esc(v.how?.[lang] ?? v.how?.en)} <a href="${esc(v.url)}" target="_blank" rel="noopener">source</a></li>`,
    )
    .join('');
  $('food-result').innerHTML = `
    <ul>${lines || '<li>-</li>'}</ul>
    ${cropRows ? `<p><strong>${esc(t.foodCrops)}</strong></p>
    <table><thead><tr><th>${esc(t.foodCrop)}</th><th>${esc(t.foodPlant)}</th><th>${esc(t.foodHarvest)}</th></tr></thead>
    <tbody>${cropRows}</tbody></table>` : ''}
    ${srcs ? `<p class="note"><strong>${esc(t.foodSources)}:</strong></p><ul class="note">${srcs}</ul>` : ''}
    ${verify ? `<p class="note"><strong>${esc(t.foodVerify)}:</strong></p><ul class="note">${verify}</ul>` : ''}
    <p class="warn">${esc(d.caveat ?? '')}</p>`;
}

async function doFood() {
  const t = pt();
  const lat = $('plat').value.trim();
  const lon = $('plon').value.trim();
  const ward = $('ward').value;
  const dwelling = $('fdwelling').value;
  const q = new URLSearchParams({ lang, dwelling, roof_material: $('fmat').value });
  // A flat's roof is shared: only send a roof the user actually stated.
  if (dwelling === 'house') q.set('roof', $('froof').value || '30');
  else if (Number($('froof').value) > 0) q.set('roof', $('froof').value);
  // Untouched household input = let the API apply the KNBS county default.
  if (foodPeopleDirty) q.set('people', $('fpeople').value || '4');
  // Follow the target the user touched last, never the other one.
  if ((foodTarget === 'point' || !ward) && lat && lon) {
    q.set('lat', lat);
    q.set('lon', lon);
  } else if (ward) {
    q.set('ward', ward);
  } else {
    $('food-status').textContent = t.foodNeed;
    return;
  }
  $('food-status').textContent = t.loading;
  try {
    const res = await fetch(`/food-security?${q}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastFood = await res.json();
    $('food-status').textContent = '';
    renderFood(lastFood);
  } catch (err) {
    $('food-status').textContent = `${t.err} ${String(err.message)}`;
  }
}

/**
 * Fallback when the browser cannot get a GPS fix (denied, unsupported, or no
 * satellites indoors - the Radisson Blu case): Cloudflare already knows the
 * approximate city from the request's IP. It is city-level at best, so the
 * coordinates are filled in, the lookup runs, and the status line says plainly
 * that this is an estimate to correct by hand.
 */
async function ipLocate(denial) {
  const t = pt();
  $('point-status').textContent = t.geoWorking;
  try {
    const res = await fetch('/ip-location');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    $('plat').value = Number(j.latitude).toFixed(5);
    $('plon').value = Number(j.longitude).toFixed(5);
    await doLookup();
    // A blocked permission deserves its own sentence up front: the estimate is
    // not "indoors, close but fuzzy", it can be tens of kilometres off because
    // it follows the ISP's exit point, not the person. Say how to fix it.
    const note = denial === 'denied' ? t.geoBlockedNote : t.ipFallbackNote;
    $('point-status').textContent = `${note} ${$('point-status').textContent}`;
    // Correction must be one action away: focus the place-name search.
    try {
      $('psearch').focus({ preventScroll: true });
    } catch {
      $('psearch').focus();
    }
  } catch {
    $('point-status').textContent = denial ? t.geoDenied : t.geoUnsupported;
  }
}

function doGeolocate() {
  const t = pt();
  if (!navigator.geolocation) {
    ipLocate(false);
    return;
  }
  $('point-status').textContent = t.geoWorking;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      $('plat').value = pos.coords.latitude.toFixed(5);
      $('plon').value = pos.coords.longitude.toFixed(5);
      doLookup(pos.coords.accuracy);
    },
    (err) => {
      // code 1 = permission denied: a different problem from no-fix-indoors,
      // with a different fix, so it gets a different message.
      ipLocate(err?.code === 1 ? 'denied' : true);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 },
  );
}

$('geolocate').addEventListener('click', doGeolocate);
$('plookup').addEventListener('click', doLookup);
$('pkitchen').addEventListener('click', doKitchen);
$('pskill').addEventListener('click', doSkill);
$('bfood').addEventListener('click', doFood);
let foodPeopleDirty = false;
$('fpeople').addEventListener('input', () => { foodPeopleDirty = true; });
let roofKeep = '30';
$('fdwelling').addEventListener('change', () => {
  const flat = $('fdwelling').value === 'flat';
  if (flat) {
    roofKeep = $('froof').value || '30';
    $('froof').value = '0';
    $('food-status').textContent = pt().flatRoofNote;
  } else {
    $('froof').value = roofKeep;
    $('food-status').textContent = '';
  }
  $('froof').disabled = flat;
  if (lastFood) doFood();
});

// Two plain questions replace the four-word aspect dropdown: midday sun and
// morning sun map onto the kitchen module's aspect categories, and "not sure"
// stays honest as unknown.
function syncAspect() {
  const noon = $('pnoon').value;
  const morning = $('pmorning').value;
  $('paspect').value =
    noon === 'unsure' || morning === 'unsure'
      ? 'unknown'
      : noon === 'sun' && morning === 'sun'
        ? 'full_sun'
        : morning === 'sun'
          ? 'morning_sun'
          : noon === 'sun'
            ? 'afternoon_shade'
            : 'shaded';
}
$('pnoon').addEventListener('change', syncAspect);
$('pmorning').addEventListener('change', syncAspect);
syncAspect();

// Measure the footprint, not the slope: length x width fills the area field.
function syncRoofArea() {
  const L = Number($('froofL').value);
  const W = Number($('froofW').value);
  if (Number.isFinite(L) && Number.isFinite(W) && L > 0 && W > 0) {
    $('froof').value = String(Math.round(L * W));
  }
}
$('froofL').addEventListener('input', syncRoofArea);
$('froofW').addEventListener('input', syncRoofArea);
syncRoofArea();

$('fmat').addEventListener('change', () => {
  const t = pt();
  const m = $('fmat').value;
  $('food-status').textContent = m === 'thatch' ? t.thatchNote : m === 'tiles' ? t.tilesNote : '';
  if (lastFood) doFood();
});

// Photo assist: the one photo question whose answer changes the water plan.
// Phone photos are downscaled in the browser first: the API caps the payload,
// and a 1024px JPEG is plenty for a roof-material call while costing the free
// AI lane far fewer tokens.
async function toDataUrl(file) {
  const read = (blob) =>
    new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result));
      fr.onerror = () => reject(new Error('could not read the file'));
      fr.readAsDataURL(blob);
    });
  try {
    if (typeof createImageBitmap === 'function') {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * scale));
      const h = Math.max(1, Math.round(bmp.height * scale));
      const canvas = new OffscreenCanvas(w, h);
      canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
      const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality: 0.85 });
      bmp.close?.();
      if (blob && blob.size > 0) return await read(blob);
    }
  } catch {
    // downscale unsupported or failed: send the original and let the cap judge
  }
  return await read(file);
}
$('bphoto').addEventListener('click', () => $('fphoto').click());
$('fphoto').addEventListener('change', async () => {
  const t = pt();
  const file = $('fphoto').files?.[0];
  if (!file) return;
  $('food-status').textContent = t.photoWorking;
  try {
    const data = await toDataUrl(file);
    const res = await fetch('/photo-roof', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ image: data }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    const map = { iron_sheet: 'iron', tiles: 'tiles', thatch: 'thatch' };
    // A low-confidence verdict never touches the dropdown: the status line
    // reports what the model said, and the human decides. Only medium/high
    // preselects, still labelled confirm-with-your-eyes.
    if (map[j.material] && j.confidence !== 'low') $('fmat').value = map[j.material];
    $('food-status').textContent = t.photoDone(j.material, j.confidence);
    if (lastFood) doFood();
  } catch {
    $('food-status').textContent = t.photoFail;
  } finally {
    $('fphoto').value = '';
  }
});

/**
 * Satellite roof check: pull the highest-resolution free imagery tile around the
 * point (Esri World Imagery, CORS-enabled so the capture happens fully in the
 * browser), crop ~150 m centred on the location, mark the exact spot with a thin
 * crosshair, and ask the same enum-locked vision route used for phone photos.
 * The verdict is a labelled estimate that preselects the material dropdown; the
 * user still confirms by eye. No keys, no paid API, no new worker surface.
 */
function lonToTileX(lon, z) { return ((lon + 180) / 360) * Math.pow(2, z); }
function latToTileY(lat, z) {
  const r = (lat * Math.PI) / 180;
  return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * Math.pow(2, z);
}
function loadSatTile(z, x, y) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('tile load failed'));
    img.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
  });
}
async function captureSatellite(lat, lon, crop = 192) {
  // Esri serves deeper zoom over most Kenyan urban areas (z20 is about 0.15 m
  // per pixel, so a roof fills the frame instead of being a speck). Where z20
  // has no coverage the tiles 404 and we fall back to z19 (~0.3 m).
  for (const z of [20, 19]) {
    const url = await captureAtZoom(lat, lon, z, crop).catch(() => null);
    if (url) {
      window.__lastSatZoom = z; // debug/test hook, nothing in the UI reads it
      return url;
    }
  }
  throw new Error('no usable imagery at this spot');
}
async function captureAtZoom(lat, lon, z, crop = 192) {
  const fx = lonToTileX(lon, z);
  const fy = latToTileY(lat, z);
  const tx = Math.floor(fx);
  const ty = Math.floor(fy);
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  const ox = Math.round(256 - (fx - tx) * 256);
  const oy = Math.round(256 - (fy - ty) * 256);
  const jobs = [];
  let loaded = 0;
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      jobs.push(loadSatTile(z, tx + dx, ty + dy).then((img) => {
        ctx.drawImage(img, ox + dx * 256, oy + dy * 256, 256, 256);
        loaded++;
      }).catch(() => {}));
    }
  }
  await Promise.all(jobs);
  if (loaded < 5) return null; // half-empty frame = no honest verdict
  // Tight crop centred on the crosshair: 192 px is about 29 m at z20, 57 m at
  // z19; the wider 320 px vote frame gives the model a second, more generous
  // look at the same spot so a single bad crop cannot decide the answer.
  const off = (512 - crop) / 2;
  // Blank-imagery guard: Esri serves uniform light-grey no-data tiles over open
  // water and unmapped remote areas. Asking a model about a flat grey square
  // only manufactures an answer, so refuse before the frame ever leaves the
  // browser. Deviation of the sampled luminance under ~3/255 means no texture.
  const samp = document.createElement('canvas');
  samp.width = 32;
  samp.height = 32;
  const sctx = samp.getContext('2d');
  sctx.drawImage(c, off, off, crop, crop, 0, 0, 32, 32);
  const px = sctx.getImageData(0, 0, 32, 32).data;
  const lum = [];
  for (let i = 0; i < px.length; i += 4) lum.push(0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]);
  const mean = lum.reduce((a, b) => a + b, 0) / lum.length;
  const dev = lum.reduce((a, v) => a + Math.abs(v - mean), 0) / lum.length;
  if (dev < 3) return null; // blank: try the next zoom down, then fail honestly
  const out = document.createElement('canvas');
  out.width = 1024;
  out.height = 1024;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(c, off, off, crop, crop, 0, 0, 1024, 1024);
  octx.strokeStyle = 'rgba(255,255,255,0.95)';
  octx.lineWidth = 4;
  octx.beginPath();
  octx.moveTo(512 - 64, 512); octx.lineTo(512 - 20, 512);
  octx.moveTo(512 + 20, 512); octx.lineTo(512 + 64, 512);
  octx.moveTo(512, 512 - 64); octx.lineTo(512, 512 - 20);
  octx.moveTo(512, 512 + 20); octx.lineTo(512, 512 + 64);
  octx.stroke();
  return out.toDataURL('image/jpeg', 0.92);
}
$('bsat').addEventListener('click', async () => {
  const t = pt();
  const lat = parseFloat($('plat').value);
  const lon = parseFloat($('plon').value);
  if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
    $('food-status').textContent = t.satNeedCoords;
    return;
  }
  $('bsat').disabled = true;
  $('food-status').textContent = t.satWorking;
  const MAT = { iron_sheet: 'iron', tiles: 'tiles', thatch: 'thatch' };
  const show = (msg) => { $('food-status').textContent = msg; };
  const pretty = (m) => t.materials?.[m] ?? m;
  try {
    // Everything runs in parallel: the OSM survey fetch, and two independent
    // satellite frames (tight + wide crop) each asked for a verdict.
    const surroundP = fetch(`/surroundings?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`)
      .then((r) => (r.ok ? r.json() : null))
      .catch(() => null);
    const caps = await Promise.allSettled([captureSatellite(lat, lon, 192), captureSatellite(lat, lon, 320)]);
    const frames = caps.filter((c) => c.status === 'fulfilled').map((c) => c.value);
    if (!frames.length) throw new Error('no imagery');
    show(t.satVoting);
    const verdicts = (await Promise.allSettled(
      frames.map((img) =>
        fetch('/photo-roof', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ image: img, source: 'satellite' }),
        }).then(async (r) => (r.ok ? r.json() : null)),
      ),
    ))
      .filter((c) => c.status === 'fulfilled' && c.value)
      .map((c) => c.value);
    const sj = await surroundP;
    const osmMat = sj?.suggestion?.roof_material ?? null; // 'iron' | 'tiles' | 'thatch', from mapped roof:material tags
    const voted = verdicts.map((v) => MAT[v.material]).filter(Boolean);
    const agree = voted.length >= 2 && voted[0] === voted[1] && voted[0] !== 'other';
    const single = voted.length === 1 ? verdicts[0] : null;

    if (osmMat) {
      // Survey data wins: a human being mapped this roof in OpenStreetMap.
      $('fmat').value = osmMat;
      const vis = agree ? voted[0] : single && single.confidence !== 'low' ? MAT[single.material] : null;
      if (vis && vis === osmMat) show(t.satOsmVision(pretty(osmMat), pretty(vis)));
      else if (vis) show(t.satOsmVisionSplit(pretty(osmMat), pretty(vis)));
      else show(t.satOsm(pretty(osmMat)));
    } else if (agree) {
      // No survey data: two independent frames agreeing is the strongest
      // evidence the vision lane can produce. Confidence is capped by what the
      // models themselves claimed - agreement lifts low+low to medium, never
      // invents "high".
      const conf = verdicts.some((v) => v.confidence === 'high') ? 'high' : 'medium';
      $('fmat').value = voted[0];
      show(t.satAgree(pretty(voted[0]), conf));
    } else if (single && single.material !== 'other' && single.confidence !== 'low') {
      $('fmat').value = MAT[single.material];
      show(t.satDone(single.material, single.confidence));
    } else if (voted.length >= 2) {
      show(t.satSplit(pretty(voted[0]), pretty(voted[1])));
    } else {
      throw new Error('no verdict');
    }
    if (lastFood) doFood();
  } catch {
    show(t.satFail);
  } finally {
    $('bsat').disabled = false;
  }
});

async function shareFood() {
  if (!lastFood) return;
  const t = pt();
  const txt = `${(lastFood.lines ?? []).join('\n')}\n\n${lastFood.caveat ?? ''}\nMsimu: https://msimu.shikunyi.workers.dev`;
  try {
    if (navigator.share) {
      await navigator.share({ text: txt });
      return;
    }
    await navigator.clipboard.writeText(txt);
    $('food-status').textContent = t.shareCopied;
  } catch (err) {
    if (err?.name !== 'AbortError') $('food-status').textContent = t.shareFailed;
  }
}
$('bshare').addEventListener('click', shareFood);

/**
 * Place-name search: type "Canopy Residence Gitanga", pick the hit, and the
 * whole dashboard follows. Proxied through the worker's /geocode route (OSM
 * Nominatim, Kenya-scoped, free and keyless). A search hit fills the
 * coordinates and runs the normal lookup, so the ward, strip, map pin and
 * surroundings all update exactly as they do for GPS - and the plan still
 * asks the user to confirm the pin.
 */
function applyPlace(r) {
  $('plat').value = Number(r.latitude).toFixed(5);
  $('plon').value = Number(r.longitude).toFixed(5);
  lastAccuracy = null; // a named place has no GPS accuracy ring to show
  doLookup();
}
async function doPlaceSearch() {
  const t = pt();
  const q = $('psearch').value.trim();
  const host = $('psearch-results');
  if (!q) return;
  host.textContent = t.searching;
  try {
    const res = await fetch(`/geocode?q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    const rs = (j.results ?? []).slice(0, 3);
    if (!rs.length) {
      host.textContent = t.searchNone;
      return;
    }
    if (rs.length === 1) {
      host.textContent = '';
      applyPlace(rs[0]);
      return;
    }
    host.innerHTML = '';
    for (const r of rs) {
      const b = document.createElement('button');
      b.type = 'button';
      const tail = String(r.display_name ?? '').split(',').slice(1, 4).join(',').trim();
      b.textContent = `${r.name}${tail ? ` - ${tail}` : ''}`;
      b.addEventListener('click', () => {
        host.innerHTML = '';
        applyPlace(r);
      });
      host.appendChild(b);
    }
    const att = document.createElement('span');
    att.textContent = t.searchAttrib;
    host.appendChild(att);
  } catch {
    host.textContent = t.searchFail;
  }
}
$('psearchgo').addEventListener('click', doPlaceSearch);
$('psearch').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    doPlaceSearch();
  }
});
for (const id of ['sw', 'en']) $(id).addEventListener('click', ptLabels);
ptLabels();
</script>
