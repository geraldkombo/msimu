name = "msimu"
main = "index.mjs"
account_id = "fdff06ddff4a96e9709519f406fa7e36"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Static dashboard is served from the same origin as the API, so the page's
# relative fetch("/advisory") works with no CORS config and no second project.
# The directory is a build artifact (npm run deploy:worker-legacy runs
# scripts/build-worker-assets.mjs first): web/ itself contains _worker.js, the
# Pages-only entry file that Workers assets validation rejects.
#
# The `binding` line is required, not decoration: /locate does point-in-polygon
# against the ward GeoJSON, and inside a Worker neither env.ASSETS nor a
# same-origin fetch() can reach these files unless the binding exists. Without it
# every lookup silently degrades to the nearest-centroid guess while still
# returning a plausible ward name.
[assets]
directory = "../dist/worker-web"
binding = "ASSETS"

# Workers AI free allowance (10,000 neurons/day, $0, no key) powers the
# roof-photo material check. Inside-the-Worker calls: no CORS, no third-party
# gateway, no rate-shed from datacenter IPs. The Kilo keyless lane in
# index.mjs stays as the off-platform fallback.
[ai]
binding = "AI"

[observability]
enabled = true
